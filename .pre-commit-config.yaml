---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
        args:
          - --assume-in-merge
      - id: check-toml
      - id: check-yaml
        args:
          - --allow-multiple-documents
          - --unsafe
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args:
          - --wrap
          - "100"
        additional_dependencies:
          - mdformat-gfm-alerts
          - mdformat-gfm
          - mdformat-toc
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types:
          - python
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types:
          - python
        pass_filenames: false
