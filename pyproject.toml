[project]
name = "iopole-api"
version = "0.1.5"
description = "Connector for Iopole API"
keywords = ["iopole", "factur-x"]
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "CNFilms", email = "technique@cinego.net" }
]

dependencies = ["requests>=2.25"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.15.9",
    "types-requests>=2.32.4.20260107",
]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=iopole_api --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100"

[tool.coverage.run]
source = ["iopole_api"]
branch = true

[tool.coverage.report]
show_missing = true
