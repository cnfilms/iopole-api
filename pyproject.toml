[project]
name = "iopole-api"
version = "0.1.4"
description = "Connector for Iopole API"
keywords = ["iopole", "factur-x"]
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "CNFilms", email = "technique@cinego.net" }
]

dependencies = ["requests>=2.25"]

[build-system]
requires = ["setuptools<82"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["iopoleapi*"]

[tool.setuptools.package-data]
iopoleapi = ["py.typed"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.9",
    "types-requests>=2.32.4.20260107",
]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["iopoleapi"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
